<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashChop - Refer & Earn</title>
  <link rel="stylesheet" href="../css/style.css">
  <script type='text/javascript' src='//pl16213274.profitableratecpm.com/97/df/7b/97df7bff03132071f1f31973f5ddc233.js'></script>
</head>
<body>
  <div class="container">
    <h1>CashChop</h1>
    <div class="form-container">
      <form id="signupForm">
        <input type="email" placeholder="Email" id="signupEmail" required>
        <input type="password" placeholder="Password" id="signupPassword" required>
        <input type="text" placeholder="Referral Code (Optional)" id="referralCode">
        <button type="submit">Signup & Pay ₦200</button>
      </form>

      <hr>

      <form id="loginForm">
        <input type="email" placeholder="Email" id="loginEmail" required>
        <input type="password" placeholder="Password" id="loginPassword" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <script src="../js/firebaseConfig.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
